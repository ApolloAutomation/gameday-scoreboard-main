name: Docs

# Build the documentation site (docs/wiki, Astro + Starlight) on a pull
# request that touches it or CHANGELOG.md, so a broken page or link fails
# the PR. The changelog page is generated from CHANGELOG.md at build time.
#
# Publishing is not done here: the site deploys (site.yml and build.yml's
# publish) build the docs and put them on the site under /docs/.

on:
  pull_request:
    paths:
      - "docs/wiki/**"
      - "CHANGELOG.md"
      - "scripts/check_docs_links.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The site's address; the docs build for its /docs/.
  SITE_URL: "https://apolloautomation.github.io/gameday-scoreboard-main"

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/wiki/package-lock.json
      - name: Install
        working-directory: docs/wiki
        run: npm ci
      - name: Build
        working-directory: docs/wiki
        run: npm run build
      # Astro passes dead links silently.
      - name: Links between pages and their anchors
        run: python3 scripts/check_docs_links.py --base "$(echo "$SITE_URL" | sed -E 's#^[a-z]+://[^/]+##')/docs" docs/wiki/dist
