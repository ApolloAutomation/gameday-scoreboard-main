name: Bug report
description: The panel, its page or the firmware did something wrong.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Issues here are public, so leave out Wi-Fi passwords and anything else private.
        Bought a scoreboard and need help with it? The [support page](https://apolloautomation.github.io/gameday-scoreboard-main/support/) has the common fixes. If none of them helps, carry on with this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the panel or its page did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them. "It happened once during a game" is useful too.
      placeholder: |
        1. Pick a team on the panel's page
        2. Wait for the start of the game
        3. ...
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: The Firmware row on the panel's page.
      placeholder: "2026.11.7"
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller
      options:
        - Game Day Scoreboard (bought it)
        - scoreboard75 controller board, built it myself
        - Apollo M-1 LED Matrix (Rev6)
        - MoonHub75 or another ESP32-S3 HUB75 board, built it myself
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: panels
    attributes:
      label: Panel layout
      description: The picture picked under Matrix in the Setup card on the panel's page, and for two rows of two, How the rows are mounted.
      options:
        - One 128x64 panel, or two 64x64 side by side
        - One 64x64 panel
        - Three wide
        - Four wide
        - Two rows of two, bottom row upside down
        - Two rows of two, all upright
        - Two rows of two, top row upside down
        - Not sure
    validations:
      required: true
  - type: input
    id: showing
    attributes:
      label: What it was showing
      description: Your team or a live mode and the game if one was on, or another display (F1, Stocks & Crypto, Flight Tracker or Weather). Say if it was in the second area or with Full screen on.
      placeholder: "Packers, live game vs Bears, 2nd quarter"
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: Optional. If the panel restarted by itself, open `http://<panel address>/gameday/crash` in a browser, like `http://gameday-2f6a70.local/gameday/crash`, and paste what it shows.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. If you build from source, run `esphome logs firmware/gameday.yaml --device <panel address>` while it happens.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Photos or video of the panel help a lot. Drag them in here.
