# Game Day Scoreboard for a HUB75 matrix on the MoonHub75 pinout, which the
# Apollo Automation M-1 LED Matrix (Rev6) shares. One firmware
# for 1-4 panels or a 2x2, chosen on device page.
substitutions:
  variant: "moonhub75"

packages:
  controller: !include controllers/moonhub75.yaml
  common: !include gameday-common.yaml

# Lets ESPHome Device Builder adopt a panel it discovers: the adopted config
# is a short file that pulls this one in from GitHub.
dashboard_import:
  package_import_url: github://ApolloAutomation/gameday-scoreboard-main/firmware/gameday.yaml@main
  import_full_config: false
